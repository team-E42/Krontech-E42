<!doctype html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
    }

    #container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #render {
      flex: 1;
      background: black;
    }

    #tts-div {
      flex: 1;
      background: linear-gradient(135deg, #58a0ff, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .tts-card {
      background: #ffffff;

      width: 100%;
      max-width: 420px;

      padding: 30px;

      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);

      display: flex;
      flex-direction: column;
      gap: 15px;

      text-align: center;
    }

    .tts-card h2 {
      margin-bottom: 15px;
    }

    .tts-card textarea {
      width: 100%;
      height: 140px;

      border-radius: 12px;
      border: 1px solid #ddd;

      padding: 12px;

      font-size: 16px;
      text-align: center;

      resize: none;
      outline: none;
    }

    .tts-card textarea:focus {
      border-color: #4a90e2;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
    }

    button {
      flex: 1;
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #speakBtn {
      background: #4a90e2;
      color: white;
    }

    #speakBtn:hover {
      background: #357abd;
    }

    .secondary {
      background: #e0e0e0;
    }

    .secondary:hover {
      background: #c7c7c7;
    }

    #langToggle {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #ddd;
      cursor: pointer;
    }

    #langToggle:hover {
      background: #ccc;
    }

    #tts-div {
      flex: 1;
      background: linear-gradient(135deg, #58a0ff, #000000);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px;
      box-sizing: border-box;
    }

  </style>
  
</head>

<body>
  <div id="container">
    <div id="render"></div>
    <div id="tts-div">
       <div class="tts-card">
      <h2>Text to Speech</h2>

      <textarea id="textInput" placeholder="Aici vine textu din limbaju semnelor..." readonly></textarea>

      <div class="controls">
        <button id="speakBtn">▶ Speak</button>
        <button id="stopBtn" class="secondary">■ Stop</button>
        <button id="langToggle">🌐 English</button>
      </div>
    </div>
  </div>
  <script type="module" src="./src/index.js"></script>
</body>
</html>
